apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: nginx-api
  name: nginx-api
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: nginx-api
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: nginx-api
    spec:
      containers:
        - image: nginx:latest
          name: nginx-proxy
          ports:
            - containerPort: 443
              protocol: TCP
          volumeMounts:
            - mountPath: /ssl
              name: nginx-api-claim0
              readOnly: true
            - mountPath: /etc/nginx/conf.d/default.conf
              name: nginx-api-cm1
              readOnly: true
              subPath: default.conf
      restartPolicy: Always
      volumes:
        - name: nginx-api-claim0
          persistentVolumeClaim:
            claimName: nginx-api-claim0
            readOnly: true
        - configMap:
            items:
              - key: nginx.conf
                path: default.conf
            name: nginx-api-cm1
          name: nginx-api-cm1
